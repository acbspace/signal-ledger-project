name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: signalledger_test
          POSTGRES_USER: signalledger
          POSTGRES_PASSWORD: signalledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U signalledger -d signalledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The store integration tests apply migrations and truncate this database,
      # so it must be disposable. They skip when this is unset.
      SIGNALLEDGER_TEST_DATABASE_URL: postgres://signalledger:signalledger@localhost:5432/signalledger_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config
